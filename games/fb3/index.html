
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frickbears 3</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#game-container {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

/* Game iframe */
#game {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% + 65px);
    border: none;
    background: #000;
}
</style>
</head>

<body>

<div id="game-container">
    <iframe
        id="game"
        src="https://www.miniplay.com/embed/five-nights-at-frickbears-3"
        allow="autoplay; fullscreen; gamepad"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
